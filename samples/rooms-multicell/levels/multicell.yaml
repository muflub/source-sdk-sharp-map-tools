# the rooms multi-cell sample level
# the grid's first line is the north row; each line runs west to east; + is a cell the room to its south-west covers
library: ../rooms.vmf
rows: 5
columns: 7
grid:
  - [~,     ~,   ~, ~,   hub,     ~,      hub]
  - [~,     hub, ~, ~,   +,       +,      +]
  - [+,     +,   +, ~,   gallery, atrium, +]
  - [+,     +,   +, hub, +,       +,      hub]
  - [court, +,   +, ~,   hall,    +,      hub]
